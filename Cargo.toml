[package]
name = "rediscovery"
version = "0.1.0"
edition = "2024"

# Code in docstrings is prohibited in this repo (owner policy, 2026-08-30);
# with no doc examples to collect, cargo test skips the rustdoc pass entirely.
[lib]
doctest = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
nalgebra = "0.35"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
config = "0.15"
serde = { version = "1", features = ["derive"] }
rand = "0.10"
rand_chacha = "0.10"

# Tier-1 pins drive 10^4 full-batch steps of dense n×m linear algebra per
# graph; `cargo test` inherits this profile, so the dependency stack that does
# that arithmetic is optimized while crate code keeps debug assertions.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
